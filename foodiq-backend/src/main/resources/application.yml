spring:
  application:
    name: foodiq-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/foodiq
    username: postgres
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

jwt:
  secret: 9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d
  expiration: 86400000

logging:
  level:
    org.hibernate.SQL: DEBUG
    com.foodiq: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

google:
  vision:
    api-key: ${VISION_API_KEY:AIzaSyD26AenRfJ3EfNgzUpkmfXqK_wEalNyDmw}

ocr-space:
