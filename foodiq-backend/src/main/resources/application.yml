spring:
  application:
    name: foodiq-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/foodiq}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
            scope: profile, email
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder-github-client-secret}
            scope: user:email, read:user

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5174}

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d}
  expiration: 86400000

tesseract:
  datapath: ${TESSDATA_PREFIX:/usr/share/tesseract-ocr/4.00/tessdata}


logging:
  level:
    org.hibernate.SQL: WARN
    com.foodiq: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
