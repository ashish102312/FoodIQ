spring:
  application:
    name: foodiq-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/foodiq
    username: postgres
    password: admin123
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=600s

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: 8080

jwt:
  secret: 9a4f2c8d3b7a1e6f45c8a0b3f267d8b1d4e6f3c8a9d2b5f8e3a9c8b5f6v8a3d
  expiration: 86400000

tesseract:
  datapath: /opt/homebrew/opt/tesseract/share/tessdata

openfoodfacts:
  base-url: https://world.openfoodfacts.org
  timeout-seconds: 5

logging:
  level:
    org.hibernate.SQL: WARN
    com.foodiq: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
